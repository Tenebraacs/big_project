info:
  name: Send Friend Request
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/friends/add
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  body:
    type: json
    data: |-
      {
        "username": "TestUser123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
