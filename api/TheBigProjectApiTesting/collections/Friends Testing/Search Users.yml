info:
  name: Search Users
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8000/api/users/search?query=Zoli
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
