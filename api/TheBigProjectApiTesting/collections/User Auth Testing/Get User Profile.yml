info:
  name: Get User Profile
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8000/api/user/profile
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
