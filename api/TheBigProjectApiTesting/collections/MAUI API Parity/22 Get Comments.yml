http:
  method: GET
  url: http://localhost:8000/api/jars/:jar_id/comments
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: jar_id
      value: "{{jar_id}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });
        test("comments array", function () {
          expect(res.body).to.have.property("comments");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

