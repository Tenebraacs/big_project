info:
  name: "13 GET jars/:jar_id (details)"
  type: http
  seq: 13

http:
  method: GET
  url: http://localhost:8000/api/jars/:jar_id
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: jar_id
      value: "1"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200 for existing jar", function () {
          expect(res.status).to.equal(200);
        });
        test("has jar and quests", function () {
          expect(res.body).to.have.property("jar");
          expect(res.body).to.have.property("quests");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `JarService.GetJarDetailsAsync`. Change `jar_id` to a real jar in your DB.
