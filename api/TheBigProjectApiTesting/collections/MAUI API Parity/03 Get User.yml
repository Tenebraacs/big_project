info:
  name: "03 Get user (session check)"
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8000/api/user
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });
        test("user has id", function () {
          expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Same as `AuthService.HasValidSessionAsync` / auth user fetch.
