info:
  name: "14 POST jars (multipart create)"
  type: http
  seq: 14

http:
  method: POST
  url: http://localhost:8000/api/jars
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  body:
    type: multipartForm
    data:
      - name: name
        value: bruno_maui_jar_{{jar_create_suffix}}
      - name: description
        value: Created from Bruno MAUI parity suite
      - name: type
        value: public_jar
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("jar_create_suffix", String(Date.now()));
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.id) {
          bru.setVar("jar_id", String(res.body.id));
        }
    - type: tests
      code: |-
        test("returns 201", function () {
          expect(res.status).to.equal(201);
        });
        test("jar id returned", function () {
          expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Same fields as `JarService.CreateJarAsync`. Unique `name` per run (scoped per creator in Laravel).
