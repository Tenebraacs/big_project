info:
  name: "15 POST jars/:jar_id with _method=PUT (update)"
  type: http
  seq: 15

http:
  method: POST
  url: http://localhost:8000/api/jars/:jar_id
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  params:
    - name: jar_id
      value: "{{jar_id}}"
      type: path
  body:
    type: multipartForm
    data:
      - name: name
        value: Updated Bruno Jar
      - name: description
        value: Updated via MAUI-style POST+_method
      - name: type
        value: public_jar
      - name: _method
        value: PUT
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 200", function () {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Matches `JarService.UpdateJarAsync` (Laravel method spoof). Set `jar_id` after **14 Create Jar** or manually.
